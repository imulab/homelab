# ComfyUI on the AMD Radeon AI PRO R9700 (RDNA4, gfx1201, 32 GB) via ROCm.
#
# Adapted to the apps conventions (see README.md), with deliberate
# deviations from the house pattern, all forced by the image design:
# - image: yanwk/comfyui-boot is the only actively maintained ROCm ComfyUI
#   image with documented R9700 success (YanWenKun/ComfyUI-Docker #171,
#   "gfx1201 ... native" on the AMD-base rocm7 line: ROCm 7.2.4, PyTorch
#   2.9.1). Official ComfyUI ships no Dockerfile; AMD's rocm/comfyui is
#   stale (last pushed 2026-05) and ~23 GB. House rule pins the dated tag;
#   a newer dated tag is the update path (core updates also arrive in-app
#   via the bundled ComfyUI-Manager). If PyTorch 2.9.1 breaks a specific
#   custom node, swap to the other ROCm line, yanwk/comfyui-boot:rocm-
#   20260930 (upstream wheels, PyTorch 2.13), and re-test.
# - user: root, breaking the dedicated-identity house pattern (3001
#   jellyfin, 3002 immich, 3003 ipmideck). The image is root-by-design:
#   venv at /opt/venv, app root at /root/ComfyUI, caches under /root/.cache.
#   Forcing a UID would fight the image for no real gain on a single-purpose
#   LAN box, so the dataset subdirectories stay root-owned and no chown is
#   needed pre-deploy.
# - ROCm runtime flags per the image README: ipc: host (contained
#   alternative: shm_size "8gb"), SYS_PTRACE, seccomp=unconfined.
#   HSA_OVERRIDE_GFX_VERSION=12.0.1 is gfx1201 itself: a no-op where native
#   support exists, and it resolved a reported R9700 KSampler hang (#164).
#   PYTORCH_HIP_ALLOC_CONF follows #171's stable RDNA4 config.
# - devices: the whole /dev/dri directory plus /dev/kfd, upstream's
#   documented mapping. An earlier revision mapped only the R9700's
#   render node via its by-path symlink renamed to renderD128, which hid
#   the GPU from ROCm (see the devices comment below for the mechanism).
# - no healthcheck: the image ships none and the house rule never
#   fabricates one.
# - GPU co-tenancy: there is no VRAM isolation between ROCm processes, so
#   this stack and the LLM stacks (truenas/apps/strata: strata-daily and
#   strata-coding) run mutually exclusively: stop one in Dockhand before
#   starting the other. Only strata-daily auto-starts after a reboot; this
#   stack and strata-coding do not.
# - kernel: the 25.10 kernel (6.12.95-production+truenas) enumerated
#   gfx1201 but wedged on first GPU context: every amdgpu init failed a
#   gfx ring test (-110) with endless "MES ring buffer is full", and
#   ComfyUI spun one core right after the "ROCm version" log line
#   (enumeration-only checks like rocminfo/device_count passed, which
#   was misleading). Resolved 2026-10-06 by upgrading to TrueNAS 26
#   (kernel 6.18): clean init and working generation. Power model:
#   keep power/control=auto; a running ComfyUI holds the device open
#   and keeps the card awake, and the card runtime-suspends whenever
#   the stack is stopped, so night sleep == scheduled stack stop.
# - first run: no models are bundled or preinstalled (agreed 2026-10-05).
#   Fastest start: open the web UI, load the official Qwen-Image native
#   workflow template from docs.comfy.org, and accept its missing-model
#   download prompts; everything else via the bundled Manager.
services:
  comfyui:
    image: yanwk/comfyui-boot:rocm7-20260930
    container_name: comfyui
    # Does NOT auto-start. One GPU and no VRAM isolation between ROCm
    # processes means a reboot must bring back exactly one tenant, and that is
    # strata-daily (truenas/apps/strata). Start ComfyUI by hand in Dockhand.
    # "no" is quoted on purpose: unquoted no is YAML boolean false and
    # Compose rejects it.
    restart: "no"
    # House pattern (ipmideck): reap orphaned subprocesses that custom
    # nodes spawn (ffmpeg and friends).
    init: true
    devices:
      # Long syntax with explicit permissions: runc 1.2 rejects device
      # entries with an empty access field, which is what compose sends
      # for long-syntax devices without a permissions key
      # ("device access at N field cannot be empty").
      # The whole /dev/dri directory, NOT a single renamed render node:
      # ROCm's runtime learns the render minor from KFD topology and
      # opens /dev/dri/renderD<N> by that host-side number, so remapping
      # the R9700's node (renderD129 on this box) to renderD128 inside
      # the container hid the GPU entirely ("No HIP GPUs are available",
      # diagnosed 2026-10-05). Directory mapping keeps host names, is
      # immune to renumbering, and matches upstream's documented mapping;
      # the A380 and ASPEED nodes ride along but ROCm ignores them.
      - source: /dev/dri
        target: /dev/dri
        permissions: rwm
      # AMD compute node, mapped directly (no by-path variant exists).
      - source: /dev/kfd
        target: /dev/kfd
        permissions: rwm
    group_add:
      # Numeric GID of the host render group; owns /dev/kfd and render nodes.
      - "${COMFYUI_RENDER_GID:?COMFYUI_RENDER_GID must be set}"
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ports:
      # Direct LAN fallback; Caddy serves the canonical
      # https://comfy.absurdlab.dev route over the proxy network.
      - "${COMFYUI_BIND_ADDRESS:?COMFYUI_BIND_ADDRESS must be set}:${COMFYUI_PUBLISHED_PORT:-8188}:8188"
    environment:
      TZ: ${TZ:-Etc/UTC}
      HSA_OVERRIDE_GFX_VERSION: "12.0.1"
      # Unified allocator config name (PYTORCH_HIP_ALLOC_CONF is deprecated
      # in the image's PyTorch 2.9.1 and warns on every boot).
      PYTORCH_ALLOC_CONF: "garbage_collection_threshold:0.9,max_split_size_mb:512"
      # The entrypoint hardcodes --listen --port 8188; extra server args go
      # through CLI_ARGS only.
      CLI_ARGS: "${COMFYUI_CLI_ARGS:---disable-smart-memory --use-pytorch-cross-attention}"
    volumes:
      # ComfyUI data tree on the puddle dataset. The code checkout itself
      # stays in the container layer: the entrypoint seeds /root/ComfyUI
      # only when main.py is absent, so a redeploy brings the image's
      # pinned core and bundled custom nodes, while everything bound below
      # persists. Note: custom nodes that pip-install into /opt/venv lose
      # those installs on container recreate (venv deliberately not
      # persisted so image updates win); reinstall via Manager after a bump.
      - "${COMFYUI_MODELS_PATH:?COMFYUI_MODELS_PATH must be set}:/root/ComfyUI/models"
      - "${COMFYUI_INPUT_PATH:?COMFYUI_INPUT_PATH must be set}:/root/ComfyUI/input"
      - "${COMFYUI_OUTPUT_PATH:?COMFYUI_OUTPUT_PATH must be set}:/root/ComfyUI/output"
      - "${COMFYUI_CUSTOM_NODES_PATH:?COMFYUI_CUSTOM_NODES_PATH must be set}:/root/ComfyUI/custom_nodes"
      - "${COMFYUI_USER_PATH:?COMFYUI_USER_PATH must be set}:/root/ComfyUI/user"
      # HuggingFace / torch caches, so custom-node model downloads land on
      # the dataset instead of the container filesystem.
      - "${COMFYUI_CACHE_PATH:?COMFYUI_CACHE_PATH must be set}:/root/.cache"
    labels:
      caddy: comfy.absurdlab.dev
      caddy.reverse_proxy: "{{upstreams 8188}}"
    networks:
      - proxy

networks:
  proxy:
    external: true
