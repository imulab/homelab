# Strata 0.2.17 (engine 0.1.63) on the AMD Radeon AI PRO R9700 (RDNA4,
# gfx1201) over the HIP backend. Published image, no local compile.
#
# WHAT CHANGED FROM THE 0.1.x STACK. 0.2.x replaces the source build with an
# engine package baked into the image, starts through `strata launch` instead
# of setup.py plus docker-entrypoint.sh, keeps its files under
# /data/Strata-data, and REFUSES to serve beyond loopback without an API key.
# The old Dockerfile is gone. The upgrade checklist is in README section 2.
#
# MUTUAL EXCLUSION: this stack and comfyui both want the one GPU. Stop one in
# Dockhand before starting the other. Both publish host :27182 / :8188
# respectively, so a mistaken co-start also fails fast on the port bind.
#
# restart: unless-stopped is deliberate: this is the one GPU stack that comes
# back by itself after a reboot. comfyui is restart: "no" and stays down.
services:
  strata:
    # Pinned on purpose. `latest-rocm-gfx120x` exists and would drift.
    image: ghcr.io/niko1221/strata:${STRATA_IMAGE_TAG:-0.2.17-rocm-gfx120x}
    container_name: strata
    restart: unless-stopped
    # The engine releases tens of GB of page-locked RAM on SIGTERM, far longer
    # than Docker's 10 s default. 0.2.x runs `strata launch --stop`, and the
    # documented grace period is 120 s.
    stop_grace_period: 2m
    # The engine pins tens of GB of host memory and fails a large pinned
    # allocation against the default memlock limit.
    ulimits:
      memlock: -1
    # Shared memory for the engine's worker pool, the size upstream documents.
    shm_size: 2g
    devices:
      # Whole /dev/dri directory plus /dev/kfd, long syntax with explicit
      # permissions: runc rejects device entries with an empty access field,
      # which is what compose sends for long syntax without a permissions key.
      # Do NOT remap a render node to a different minor. ROCm opens renderD<N>
      # by the number KFD topology reports.
      - source: /dev/dri
        target: /dev/dri
        permissions: rwm
      - source: /dev/kfd
        target: /dev/kfd
        permissions: rwm
    group_add:
      # Numeric GID of the host render group, which owns /dev/kfd and the
      # render nodes. Verify: stat -c '%n gid=%g' /dev/kfd /dev/dri/renderD*
      - "${STRATA_RENDER_GID:?STRATA_RENDER_GID must be set}"
    ports:
      # Direct LAN fallback. The server listens on every address inside the
      # container and this publishes one address. Caddy separately serves
      # https://strata.absurdlab.dev over the external proxy network.
      #
      # Host port 27182, NOT 8080: the TrueNAS web UI owns host 8080 on this
      # box and Caddy holds 80/443. The container port stays 8080. 27182 is
      # below Linux's ephemeral range (32768-60999), so Docker's bind cannot
      # race a transient outbound allocation.
      - "${STRATA_BIND_ADDRESS:?STRATA_BIND_ADDRESS must be set}:${STRATA_PUBLISHED_PORT:-27182}:8080"
    volumes:
      # /data holds Strata-data/ (model files, prepared pack), state/ (presets,
      # tuning, the key), install/ (run settings, logs) and home/. It lives on
      # puddle. On first start 0.2.x moves any old /data/models, /data/packs and
      # /data/mtp into /data/Strata-data. The old /data/config is not read.
      - "${STRATA_DATA_PATH:?STRATA_DATA_PATH must be set}:/data"
      # Model shards, read-only, from the Optane 900P. The engine copies the
      # experts and the n-gram table into RAM at start, so this mount decides
      # cold-start time only, not inference speed. MODEL_PATH must name the
      # folder that holds the shards directly.
      - "${STRATA_MODELS_PATH:?STRATA_MODELS_PATH must be set}:/models:ro"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FAMILY: ${STRATA_FAMILY:-swift}
      MODEL: ${STRATA_MODEL:-IQ3_S}
      # 262144 is the model's native trained ceiling, so no rope scaling.
      CONTEXT: ${STRATA_CONTEXT:-262144}
      KV: ${STRATA_KV:-int8}
      # on | off | gpu | cpu. From 24 GB of VRAM the card's reader is used
      # (about 1.4 GiB of VRAM, 0.1 to 0.5 s per picture) instead of the CPU
      # reader (seconds per picture, no VRAM). Vision is kept for OCR and for
      # indexing the NAS video vault.
      VISION: ${STRATA_VISION:-on}
      # RESTRICTION, NOT A CONVENIENCE. 0.2.x refuses a non-loopback bind
      # without a key, and every /v1 request must carry
      # `Authorization: Bearer <key>`. Only GET /health is open. A key also
      # switches the DNS-rebinding Host check off entirely, so the key becomes
      # the whole control. Set it as a PLAIN env var in Dockhand, never the
      # key-icon secret toggle: secrets do not survive a daemon-initiated
      # restart and this stack is restart: unless-stopped.
      API_KEY: ${STRATA_API_KEY:?STRATA_API_KEY must be set - see .env.example}
      # In-container path to the shards folder. The default is the Optane
      # pre-seed of the abliterated (uncensored) Swift 1.5 build. Set
      # STRATA_MODEL_PATH to empty to let the container download the model
      # instead (~84 GB into /data on first start).
      MODEL_PATH: ${STRATA_MODEL_PATH:-/models/sc117-swift-IQ3_S}
      # auto | mtp | dflash2 | off. `auto` takes what the model ships with.
      DRAFTING: ${STRATA_DRAFTING:-auto}
      # Advanced engine settings, space separated, same as `strata launch --set`.
      # Example: "prefill=32768 STRATA_HIP_QUEUE_PRIME=1".
      STRATA_SET: ${STRATA_SET:-}
    labels:
      caddy: ${STRATA_HOSTNAME:-strata.absurdlab.dev}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      # Dots nest directives in caddy-docker-proxy labels, so this renders
      # inside the reverse_proxy block. The web UI is served through Caddy over
      # the same origin as the API, and its own /v1 calls would 401 without
      # this. It also carries the key for any other client that reaches the
      # model through the hostname.
      caddy.reverse_proxy.header_up: "Authorization \"Bearer ${STRATA_API_KEY}\""
    networks:
      - proxy

networks:
  proxy:
    external: true
