# Hermes, the Nous Research personal-agent gateway on the Strata Swift 1.5
# endpoint.
#
# Stock image, no local Dockerfile: the official nousresearch/hermes-agent,
# pinned by digest. The gateway is s6-supervised. A single /opt/data volume
# holds all state (config.yaml, .env, sessions, memories, skills).
#
# Model and email are configured in the Hermes app after the first Deploy, not
# in this file. The dashboard and the container's `hermes` CLI write them to
# /opt/data. This compose file only wires the deployment.
#
# The gateway reaches Strata container-to-container over the external proxy
# network (http://strata:8080/v1), not through Caddy or DNS. Strata 0.2.17
# requires the API key on every /v1 request. Enter the same STRATA_API_KEY in
# the app's model setup. The key is stored in /opt/data/.env.
#
# Surfaces: email is the primary channel, configured on the dashboard Channels
# page. The web dashboard (:9119) is served through Caddy at
# hermes.absurdlab.dev. The OpenAI-compatible API server (:8642) is keyed and
# bound to the LAN for future tools, desktop, and mobile clients.
#
# Dashboard auth is mandatory on a non-loopback bind. Hermes fails closed at
# startup if a dashboard auth provider is missing. The bundled username and
# password provider satisfies it on a trusted LAN.
services:
  hermes:
    image: nousresearch/hermes-agent:rc.15-v0.21.7-amd64@sha256:3140cc382d3f21a18019d28a1f89efb2af21ae9f86364895ccc019c7c7f8a446
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # Web dashboard (s6-supervised alongside the gateway).
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:-operator}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?required - set in Dockhand}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?required - set in Dockhand}"
      # OpenAI-compatible API server (Open WebUI, desktop, mobile clients).
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${API_SERVER_KEY:?required - set in Dockhand}"
      API_SERVER_CORS_ORIGINS: ${HERMES_API_CORS_ORIGINS:-}
      # Model and email are absent on purpose. Configure them in the app. They
      # are stored in /opt/data (config.yaml and .env), not as process env.
    ports:
      # Direct LAN fallback (house pattern). Caddy serves the canonical
      # https://hermes.absurdlab.dev dashboard route over the external proxy
      # network; the hostname resolves only via the photonicat dnsmasq hijack.
      # 9119 and 8642 are uncommon and away from every port in use here.
      - "${HERMES_BIND_ADDRESS:-192.168.20.11}:9119:9119"
      - "${HERMES_BIND_ADDRESS:-192.168.20.11}:8642:8642"
    volumes:
      - "${HERMES_DATA_PATH:?HERMES_DATA_PATH must be set - see .env.example}:/opt/data"
    labels:
      caddy: hermes.absurdlab.dev
      caddy.reverse_proxy: "{{upstreams 9119}}"
    networks:
      - proxy

networks:
  proxy:
    external: true
