      - title: TrueNAS IPMI
        description: TrueNAS IPMI / BMC
        url: https://192.168.20.10
        icon: mdi-server-network
      - title: Dockhand
        description: Container & stack management
        url: http://192.168.20.11:30328
        icon: mdi-docker

