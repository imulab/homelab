    icon: mdi-server
    items:
      - title: TrueNAS Backup (HTTP)
        description: Backup NAS web UI over HTTP
        url: http://192.168.10.11:8080
        icon: mdi-nas
      - title: TrueNAS Backup (HTTPS)
        description: Backup NAS web UI over HTTPS
        url: https://192.168.10.11:8443
